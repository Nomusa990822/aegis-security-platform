name: Container image security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --pull -t aegis-security-platform:ci .

      - name: Generate CycloneDX container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: cyclonedx
          output: aegis-image.sbom.cdx.json
          exit-code: '0'
          vuln-type: os,library
          version: v0.70.0
          trivyignores: .trivyignore

      - name: Upload container SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aegis-container-sbom
          path: aegis-image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Report all HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: table
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.70.0
          trivyignores: .trivyignore

      - name: Fail on fixable HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.70.0
          trivyignores: .trivyignore
