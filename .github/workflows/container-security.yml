name: Container image security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-scan:
    name: Docker image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build application image
        run: docker build --pull -t aegis-security-platform:ci .

      - name: Generate CycloneDX container SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: cyclonedx
          output: aegis-image.sbom.cdx.json
          exit-code: '0'
          vuln-type: os,library
          version: v0.70.0
          trivyignores: .trivyignore

      - name: Validate CycloneDX SBOM
        run: |
          python - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path

          path = Path("aegis-image.sbom.cdx.json")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("SBOM validation failed: file is missing or empty.")

          try:
              bom = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"SBOM validation failed: invalid JSON ({exc}).")

          if not isinstance(bom, dict):
              raise SystemExit("SBOM validation failed: document root must be a JSON object.")
          if bom.get("bomFormat") != "CycloneDX":
              raise SystemExit("SBOM validation failed: bomFormat is not CycloneDX.")
          spec_version = bom.get("specVersion")
          if not isinstance(spec_version, str) or not spec_version.strip():
              raise SystemExit("SBOM validation failed: specVersion is missing.")

          components = bom.get("components")
          if not isinstance(components, list) or not components:
              raise SystemExit("SBOM validation failed: no top-level components were found.")

          invalid = [
              index for index, component in enumerate(components)
              if not isinstance(component, dict)
              or not isinstance(component.get("type"), str)
              or not component["type"].strip()
              or not isinstance(component.get("name"), str)
              or not component["name"].strip()
          ]
          if invalid:
              raise SystemExit(
                  "SBOM validation failed: components have missing/invalid type or name "
                  f"(indexes: {invalid[:10]})."
              )

          bom_refs = [
              component["bom-ref"] for component in components
              if isinstance(component.get("bom-ref"), str)
          ]
          if len(bom_refs) != len(set(bom_refs)):
              raise SystemExit("SBOM validation failed: duplicate component bom-ref values found.")

          dependencies = bom.get("dependencies", [])
          if not isinstance(dependencies, list):
              raise SystemExit("SBOM validation failed: dependencies must be a JSON array.")

          type_counts = collections.Counter(component["type"] for component in components)
          type_summary = ", ".join(
              f"{kind}: {count}" for kind, count in sorted(type_counts.items())
          )
          summary = [
              "### CycloneDX SBOM validation",
              "",
              "- **Result:** Passed",
              "- **Format:** CycloneDX",
              f"- **Specification version:** {spec_version}",
              f"- **Top-level components:** {len(components)}",
              f"- **Dependency relationships:** {len(dependencies)}",
              f"- **Component types:** {type_summary}",
              f"- **Serial number present:** {'Yes' if bom.get('serialNumber') else 'No'}",
              "",
              "Validation confirms basic SBOM structure and component metadata; it does not certify package accuracy or prove the image is vulnerability-free.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")

          print(
              f"SBOM validation passed: CycloneDX {spec_version}, "
              f"{len(components)} components, {len(dependencies)} dependency relationships."
          )
          PY

      - name: Upload container SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-container-sbom
          path: aegis-image.sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Report all HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: table
          exit-code: '0'
          ignore-unfixed: 'false'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.70.0
          trivyignores: .trivyignore

      - name: Fail on fixable HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: aegis-security-platform:ci
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          vuln-type: os,library
          severity: HIGH,CRITICAL
          version: v0.70.0
          trivyignores: .trivyignore
