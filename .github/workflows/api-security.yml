name: API security baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-api-baseline:
    name: OWASP ZAP API baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install locked application dependencies
        working-directory: backend
        run: python -m pip install -r requirements.lock

      - name: Generate isolated test credentials and target address
        id: test-config
        shell: bash
        run: |
          set -euo pipefail

          analyst_token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          approver_token="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          checkpoint_key="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          gateway="$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')"

          if [ -z "$gateway" ]; then
            echo "Unable to determine the Docker bridge gateway."
            exit 1
          fi

          echo "::add-mask::$analyst_token"
          echo "::add-mask::$approver_token"
          echo "::add-mask::$checkpoint_key"

          echo "analyst_token=$analyst_token" >> "$GITHUB_OUTPUT"
          echo "approver_token=$approver_token" >> "$GITHUB_OUTPUT"
          echo "target_origin=http://${gateway}:8000" >> "$GITHUB_OUTPUT"

          echo "AEGIS_DATABASE_PATH=$RUNNER_TEMP/aegis-zap.db" >> "$GITHUB_ENV"
          echo "AEGIS_AUDIT_CHECKPOINT_DIR=$RUNNER_TEMP/aegis-zap-checkpoints" >> "$GITHUB_ENV"
          echo "AEGIS_ANALYST_TOKEN=$analyst_token" >> "$GITHUB_ENV"
          echo "AEGIS_APPROVER_TOKEN=$approver_token" >> "$GITHUB_ENV"
          echo "AEGIS_ANALYST_ID=zap-test-analyst" >> "$GITHUB_ENV"
          echo "AEGIS_APPROVER_ID=zap-test-approver" >> "$GITHUB_ENV"
          echo "AEGIS_AUDIT_CHECKPOINT_KEY=$checkpoint_key" >> "$GITHUB_ENV"

      - name: Start isolated AEGIS API
        shell: bash
        run: |
          set -euo pipefail

          cd backend
          nohup python -m uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > "$RUNNER_TEMP/aegis-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aegis-api.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "AEGIS API is healthy and ready for the isolated scan."
              exit 0
            fi
            sleep 2
          done

          echo "AEGIS API did not become healthy. Startup log follows:"
          cat "$RUNNER_TEMP/aegis-api.log"
          exit 1

      - name: OWASP ZAP baseline scan with analyst role
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.test-config.outputs.analyst_token }}
          ZAP_AUTH_HEADER_SITE: ${{ steps.test-config.outputs.target_origin }}
        with:
          target: ${{ steps.test-config.outputs.target_origin }}/openapi.json
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          cmd_options: "-S -s -T 10"
          allow_issue_writing: false
          fail_action: false
          artifact_name: aegis-zap-analyst-report

      - name: OWASP ZAP baseline scan with approver role
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ steps.test-config.outputs.approver_token }}
          ZAP_AUTH_HEADER_SITE: ${{ steps.test-config.outputs.target_origin }}
        with:
          target: ${{ steps.test-config.outputs.target_origin }}/openapi.json
          format: openapi
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0
          cmd_options: "-S -s  -T 10"
          allow_issue_writing: false
          fail_action: false
          artifact_name: aegis-zap-approver-report

      - name: Stop isolated AEGIS API
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/aegis-api.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/aegis-api.pid")" 2>/dev/null || true
          fi
