name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: aegis_test
          POSTGRES_PASSWORD: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegis_test -d aegis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AEGIS_TEST_POSTGRES_URL: postgresql+psycopg://aegis_test:aegis_test@localhost:5432/aegis_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Validate dependency lockfile
        run: python .github/scripts/verify_requirements_lock.py

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Validate dashboard JavaScript syntax
        run: |
          node --check backend/app/static/app.js
          node --check backend/app/static/response.js

      - name: Install dependency vulnerability auditor
        run: python -m pip install pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit

      - name: Run complete backend test suite
        working-directory: backend
        run: python -m pytest -q
