name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Validate dependency lockfile
        run: python .github/scripts/verify_requirements_lock.py

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Install dependency vulnerability auditor
        run: python -m pip install pip-audit

      - name: Audit installed Python dependencies
        run: pip-audit

      - name: Run complete backend test suite
        working-directory: backend
        run: python -m pytest -q
